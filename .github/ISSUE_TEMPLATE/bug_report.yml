name: Bug report
description: Report a reproducible problem with GWM for Home Assistant.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Remove GWM credentials, access and refresh tokens, security PINs, VINs, exact vehicle locations, private URLs, and personal Home Assistant configuration before submitting.

  - type: input
    id: version
    attributes:
      label: GWM for Home Assistant version
      description: Include the integration version or commit if known.
      placeholder: "Example: 0.2.0"
    validations:
      required: true

  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
      placeholder: "Example: 2026.6.1"
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: Installation method
      options:
        - HACS custom integration
        - Manual custom integration install
        - Development branch
        - Other
    validations:
      required: true

  - type: dropdown
    id: affected_area
    attributes:
      label: Affected area
      options:
        - GWM client library
        - Custom integration
        - Config flow or setup
        - Entities or device model
        - Diagnostics or repairs
        - Remote commands
        - Integration packaging or dependencies
        - Documentation
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - amd64
        - aarch64
        - armv7
        - Other
        - Not sure
    validations:
      required: true

  - type: input
    id: vehicle
    attributes:
      label: Vehicle and region
      description: Share only broad details. Do not include VIN.
      placeholder: "Example: Vehicle model, country"

  - type: markdown
    attributes:
      value: |
        For sign-in or token-refresh problems, please complete this check so I can see whether the account works in the official app:

        1. Temporarily disable the GWM integration in Home Assistant to stop automatic retries.
        2. Sign in to the official GWM mobile app for your region with **the exact same account used by the integration**.
        3. Check whether you can sign in and see your vehicle.
        4. Sign out of the app before enabling the integration again.

  - type: dropdown
    id: official_app_test
    attributes:
      label: Official app test result
      description: For other bugs, select the unrelated option. If you were unable to test, explain why in Additional context.
      options:
        - Sign-in works and my vehicle is visible.
        - Sign-in works, but my vehicle is missing.
        - Sign-in fails.
        - Unable to test; explanation provided below.
        - My issue is unrelated to sign-in or token refresh.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps that trigger the issue.
      placeholder: |
        1. Add or reload the integration...
        2. Wait for the operation...
        3. See the error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste relevant Home Assistant logs after removing sensitive information.
      render: text

  - type: textarea
    id: extra_context
    attributes:
      label: Additional context
      description: Add screenshots, example YAML, or anything else that helps explain the issue.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I removed GWM credentials, access and refresh tokens, security PINs, VINs, exact vehicle locations, private URLs, and personal Home Assistant configuration.
          required: true
        - label: I checked the existing issues for a similar report.
          required: true
