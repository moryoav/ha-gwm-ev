name: Python

on:
  push:
    branches: [main, feature/integration-only]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  client-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "aiohttp==3.13.3" build "cryptography==46.0.2" mypy pytest pytest-asyncio ruff "setuptools>=77.0.3" twine wheel "yarl==1.22.0"
      - run: ruff check gwm_client tests/python/client scripts/verify_client_distribution.py
      - run: python -m mypy gwm_client
      - run: python -m compileall -q gwm_client tests/python/client scripts/verify_client_distribution.py
      - run: pytest tests/python/client
      - run: python -m build --no-isolation
      - run: python -m twine check dist/*
      - run: python scripts/verify_client_distribution.py dist

  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install aiohttp cryptography homeassistant pytest pytest-asyncio pytest-cov ruff
      - run: ruff check gwm_client custom_components tests/python
      - run: python -m compileall -q gwm_client custom_components tests/python
      - name: Run tests with coverage
        run: >
          pytest tests/python
          --cov=gwm_client
          --cov=custom_components/gwm_ora
          --cov-report=xml:coverage.xml
          --cov-report=term-missing
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          disable_search: true
