name: Python

on:
  push:
    branches: [main, feature/apac]
  pull_request:
    branches: [main, feature/apac]

permissions:
  contents: read

jobs:
  bundled-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "homeassistant==2026.1.0" pytest pytest-asyncio
      - name: Verify the HACS ZIP and APAC storage on the minimum Home Assistant version
        run: pytest tests/python/test_hacs_release.py tests/python/test_apac_storage.py

  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "homeassistant==2026.10.1" pytest pytest-asyncio pytest-cov mypy ruff
      - run: ruff check custom_components tests/python scripts
      - run: python -m mypy --follow-imports=silent custom_components/gwm_ora/gwm_client
      - run: python -m compileall -q custom_components tests/python scripts
      - name: Run tests with coverage
        run: >
          pytest tests/python
          --cov=custom_components/gwm_ora
          --cov-report=xml:coverage.xml
          --cov-report=term-missing
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          disable_search: true
