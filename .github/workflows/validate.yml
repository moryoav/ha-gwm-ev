name: Validate

on:
  push:
    branches:
      - main
      - feature/apac
  pull_request:
    branches:
      - main
      - feature/apac
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
