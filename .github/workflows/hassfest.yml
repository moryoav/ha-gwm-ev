name: Hassfest

on:
  push:
    branches:
      - main
      - feature/apac
      - test/russia-certificate-enrollment
  pull_request:
    branches:
      - main
      - feature/apac
      - test/russia-certificate-enrollment
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hassfest
        uses: home-assistant/actions/hassfest@master
