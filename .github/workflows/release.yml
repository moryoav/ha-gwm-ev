name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate-hacs:
    uses: ./.github/workflows/validate.yml

  hassfest:
    uses: ./.github/workflows/hassfest.yml

  github-release:
    needs: [validate-hacs, hassfest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Check tag and build HACS ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          asset="$(python scripts/build_hacs_release.py "$GITHUB_REF_NAME" "$RUNNER_TEMP")"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Extract changelog notes
        shell: bash
        run: |
          python - "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release_notes.md" <<'PY'
          from pathlib import Path
          import re
          import sys

          tag = sys.argv[1]
          version = tag[1:] if tag.startswith("v") else tag
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          heading = re.compile(rf"^## \[{re.escape(version)}\](?:\s+-\s+.*)?$")

          start = None
          for index, line in enumerate(lines):
              if heading.match(line):
                  start = index + 1
                  break

          if start is None:
              raise SystemExit(f"CHANGELOG.md has no heading for {tag}")

          end = len(lines)
          for index in range(start, len(lines)):
              if lines[index].startswith("## ["):
                  end = index
                  break

          notes = "\n".join(lines[start:end]).strip()
          if not notes:
              raise SystemExit(f"CHANGELOG.md has no notes for {tag}")
          print(notes)
          PY

      - name: Publish GitHub release with HACS ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.package.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            asset_name="$(basename "$ASSET")"
            release_api="repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME"
            stored_digest="$(gh api "$release_api" --jq ".assets[] | select(.name == \"$asset_name\") | .digest")"
            if [ -z "$stored_digest" ]; then
              gh release upload "$GITHUB_REF_NAME" "$ASSET"
            else
              local_digest="sha256:$(sha256sum "$ASSET" | cut -d ' ' -f 1)"
              if [ "$stored_digest" != "$local_digest" ]; then
                echo "Existing $asset_name does not match this tag's ZIP" >&2
                exit 1
              fi
            fi
            if [ "$(gh api "$release_api" --jq '.draft')" = "true" ]; then
              gh release edit "$GITHUB_REF_NAME" --draft=false
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$ASSET" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release_notes.md" \
              --verify-tag
          fi
