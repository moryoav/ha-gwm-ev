[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["^custom_components/gwm_ora/gwm_client/live_poc\\.py$"]
